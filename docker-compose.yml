services:
  graphpaper.api:
    image: ch1mple/graphpaper-api:latest
    build:
      context: .
      dockerfile: GraphPaper.API/Dockerfile
    depends_on:
      graphpaper.database:
        condition: service_healthy
      graphpaper.ollama-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=graphpaper.database;Port=5432;Database=graphpaper_db;Username=postgres;Password=postgres
      - GEMINI_API_KEY=AIzaSyD8FJHoheKZpwoki0xCIY_mkbboPzLrlu0
      - GEMINI_KNOWLEDGE_API_KEY=AIzaSyDTRYVKF8up5YD09cZFRwMRxJloaUpc2mA
      - OLLAMA_BASE_URL=http://graphpaper.ollama:11434
      - OLLAMA_MODEL=qwen2.5:14b
      - JWT__SecretKey=GraphPaper_SECRETKEY_SIEUCAPBAOMAT_VAYMACHUADU16KYTU
      - JWT__Issuer=GraphPaper_Issuer
      - JWT__Audience=GraphPaper_Audience
    ports:
      - "5000:5000"

  graphpaper.database:
    image: pgvector/pgvector:pg16
    container_name: graphpaper_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphpaper_db
    ports:
      - "5434:5432"
    volumes:
      - pg_graph_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphpaper_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  graphpaper.ollama:
    image: ollama/ollama:latest
    container_name: graphpaper_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_GPU_LAYERS=99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # One-shot init container: pulls model if not already present, then exits.
  # ollama_data volume persists across docker compose down (without -v),
  # so subsequent starts skip the pull and complete instantly.
  graphpaper.ollama-init:
    image: ollama/ollama:latest
    depends_on:
      graphpaper.ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://graphpaper.ollama:11434
    entrypoint: >
      sh -c "
        echo 'Checking if qwen2.5:14b is already pulled...';
        if ollama list | grep -q 'qwen2.5:14b'; then
          echo 'Model qwen2.5:14b already exists. Skipping pull.';
        else
          echo 'Pulling qwen2.5:14b (first time only, ~9GB)...';
          ollama pull qwen2.5:14b;
          echo 'Pull complete.';
        fi
      "
    restart: "no"

  # GPU version (RTX 5060 Ti - Blackwell SM 120)
  graphpaper.parser:
    image: ghcr.io/docling-project/docling-serve-cu128:latest
    container_name: graphpaper_parser
    gpus: all
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_ENABLE_DOCS=1
      - TORCH_CUDA_ARCH_LIST=12.0
      - CUDA_VISIBLE_DEVICES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "5001:5001"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]

volumes:
  pg_graph_data:
  ollama_data: